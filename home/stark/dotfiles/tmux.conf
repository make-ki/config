# ==============================================================================
# TMUX CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Prefix Key
# ------------------------------------------------------------------------------
# Change Ctrl-b if you want to .

# ------------------------------------------------------------------------------
# 2. General Settings & Ergonomics
# ------------------------------------------------------------------------------
# Enable mouse support (resizing panes, selecting windows, scrolling)
set -g mouse on

# Increase scrollback history limit
set -g history-limit 50000

# Start window and pane indexing at 1 (instead of 0) for easier reach
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Reduce escape-time delay for faster response in vim
set -sg escape-time 10

# Set terminal overrides for correct color rendering
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# ------------------------------------------------------------------------------
# 3. TPM (Tmux Plugin Manager) & Plugins
# ------------------------------------------------------------------------------
# TPM itself
set -g @plugin 'tmux-plugins/tpm'

# Navigation and integration with Neovim
set -g @plugin 'aserowy/tmux.nvim'

# Fuzzy finder for session management (omerxx)
set -g @plugin 'omerxx/tmux-sessionx'

# Save and restore tmux environments across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Configure tmux-sessionx
set -g @sessionx-bind 'o' # Press prefix + o to open sessionx

# ------------------------------------------------------------------------------
# 4. Initialize Plugin Manager (Must be at the very bottom)
# ------------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
