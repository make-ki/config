# #######################################################################################
# CUSTOMIZED HYPRLAND CONFIG BASED ON I3 PREFERENCES
# #######################################################################################

autogenerated = 0 # Config is now manual

################
### MONITORS ###
################
#monitor=,preferred,auto,1
#monitor = HDMI-A-1, 1920x1080@60, auto, 1
monitor=eDP-1, 1920x1080@60, 0x0, 1

# NOTE: No external monitor config here. The HDMI/DP ports on the NVIDIA GPU
# (HDMI-A-5, DP-3, eDP-2) have no CRTC under PRIME render offload
# (see modules/hardware.nix), so mirroring to them fails with
# "getCurrentCRTC: No CRTC" errors at startup. If you plug in an external
# monitor, add a monitor= line for it here.


###################
### MY PROGRAMS ###
###################
# Reverted to Kitty and Wofi as requested
$terminal = kitty
$fileManager = dolphin
$menu = ~/.config/hypr/wofi_search.sh
#$menu = caelestia launcher

#################
### AUTOSTART ###
#################
# Note: 'feh' and 'picom' do not work on Hyprland (Wayland).
# Use 'hyprpaper' for wallpapers instead of feh.

exec-once = hyprpaper -c ~/.config/hypr/hyprpaper.conf &
# NOTE: hypridle is intentionally NOT started here. The hypridle package ships
# a systemd user service (hypridle.service) that already starts it; starting it
# here as well spawns TWO idle daemons (both try to lock on timeout).
exec-once = waybar & 
exec-once = nm-applet &
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
# exec-once = /usr/lib/polkit-kde-authentication-agent-1 # You might need a polkit agent


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = AQ_NO_MODIFIERS,1

# Only the Intel GPU (card1) has usable outputs. The NVIDIA GPU (card0) is
# headless under PRIME render offload (see modules/hardware.nix), so we don't
# hand it to the compositor — scanning it just logs "getCurrentCRTC: No CRTC"
# errors on every startup. Apps that need the NVIDIA GPU still get it via
# `nvidia-offload <cmd>`; the compositor only drives the Intel outputs.
env = AQ_DRM_DEVICES,/dev/dri/card1

# NVIDIA env vars removed — with PRIME offload, the desktop runs on Intel.
# These vars forced every app onto the headless NVIDIA GPU, causing hangs.
# To use the NVIDIA GPU for specific apps, launch them with:
#   nvidia-offload <command>
# e.g. nvidia-offload steam, nvidia-offload obs, etc.
#
# For apps that need NVIDIA VA-API video decode, run via:
#   nvidia-offload LIBVA_DRIVER_NAME=nvidia __GLX_VENDOR_LIBRARY_NAME=nvidia <command>
cursor {
    no_hardware_cursors = true
}

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2
    gaps_out = 2  # Matched your i3 'gaps outer 5'

    border_size = 0
    
    # Colors (You can change these to match your i3 theme)
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle 
    resize_on_border = false
}

decoration {
    rounding = 0 # i3 usually has sharp corners
    
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 2
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 2, default
}

dwindle {
    # NOTE: `pseudotile` was removed from the dwindle layout in Hyprland v0.45.
    # `preserve_split` keeps manual split direction across resizes (the useful part).
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 
    disable_hyprland_logo = false 
}


#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 
    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################

# Set "Alt" key as main modifier (Mod1 in i3 = ALT in Hyprland)
$mainMod = ALT

bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S_grim.png') | wl-copy
# --- Application Binds (From i3) ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, C, exec, dolphin
bind = $mainMod, O, exec, vesktop
bind = $mainMod, P, exec, firefox
bind = $mainMod SHIFT, P, exec, firefox --private-window
bind = $mainMod, N, exec, obsidian

# --- Window Management (From i3) ---
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod SHIFT, Space, togglefloating, 
bind = $mainMod, F, fullscreen, 
bind = $mainMod, apostrophe, exec, hyprlock

# --- Focus Moving (Using your specific i3 j/k/l/; mapping) ---
# j = left, k = down, l = up, ; = right
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# arrow keys fallback
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Move Windows (Shift + direction) ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# arrow keys fallback
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Layout/Splits ---
# NOTE: `togglesplit` is no longer a dispatcher in modern Hyprland —
# it's a `layoutmsg` argument now (`hyprctl dispatch togglesplit` -> invalid).
bind = $mainMod, V, layoutmsg, togglesplit # Equivalent-ish to split v
bind = $mainMod, E, layoutmsg, togglesplit # Equivalent-ish to split h

# "Layouts" (Stacking/Tabbed)
# Hyprland uses "Groups" for tabbed-like behavior
bind = $mainMod, W, togglegroup, # Replaces layout tabbed
bind = $mainMod, S, lockactivegroup, toggle # Replaces layout stacking (approx)
bind = $mainMod, A, changegroupactive, f # Cycle through tabbed windows (focus parent in i3)

# --- Workspaces ---
# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, x, togglespecialworkspace, cheat

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Session Management ---
bind = $mainMod SHIFT, C, exec, hyprctl reload # Reload config
bind = $mainMod SHIFT, E, exit, # Exit Hyprland

# --- Hardware Keys ---
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod SHIFT, A, exec, ~/.local/bin/dual-audio toggle
# Brightness (requires brightnessctl)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Mouse Bindings ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Fix some dragging issues with XWayland
#windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

