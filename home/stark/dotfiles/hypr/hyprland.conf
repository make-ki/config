# #######################################################################################
# CUSTOMIZED HYPRLAND CONFIG BASED ON I3 PREFERENCES
# #######################################################################################

autogenerated = 0 # Config is now manual

################
### MONITORS ###
################
monitor=eDP-1, 1920x1080@60, 0x0, 1

# NOTE: No external monitor config here. The HDMI/DP ports on the NVIDIA GPU
# (HDMI-A-5, DP-3, eDP-2) have no CRTC under PRIME render offload
# (see modules/hardware.nix), so mirroring to them fails with
# "getCurrentCRTC: No CRTC" errors at startup.

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = dolphin
$menu = ~/.config/hypr/wofi_search.sh

#################
### AUTOSTART ###
#################
# NOTE: hypridle is intentionally NOT started here. The hypridle package ships
# a systemd user service (hypridle.service) that already starts it.
exec-once = awww-daemon &
exec-once = sleep 0.5 && awww img /home/stark/Pictures/wallpaper.jpg &
exec-once = waybar &
exec-once = nm-applet &
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = AQ_NO_MODIFIERS,1
env = AQ_DRM_DEVICES,/dev/dri/card1

cursor {
    no_hardware_cursors = true
}

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2
    gaps_out = 2
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 2
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 2, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################
$mainMod = ALT

bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S_grim.png') | wl-copy

# --- Application Binds ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, C, exec, dolphin
bind = $mainMod, O, exec, vesktop
bind = $mainMod, P, exec, firefox
bind = $mainMod SHIFT, P, exec, firefox --private-window
bind = $mainMod, N, exec, obsidian

# --- Window Management ---
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, apostrophe, exec, hyprlock

# --- Focus Moving ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Move Windows ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Layout/Splits ---
bind = $mainMod, V, layoutmsg, togglesplit
bind = $mainMod, E, layoutmsg, togglesplit

# --- Groups (Tabbed/Stacking) ---
bind = $mainMod, W, togglegroup,
bind = $mainMod, S, lockactivegroup, toggle
bind = $mainMod, A, changegroupactive, f

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, x, togglespecialworkspace, cheat

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Session Management ---
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, E, exit,

# --- Hardware Keys ---
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod SHIFT, A, exec, ~/.local/bin/dual-audio toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Voice (Windows key push-to-talk for opencode) ---
# Super is unused on this box (mainMod = ALT). Bare SUPER_L toggles dictation:
# press = start recording in opencode, press again = stop + transcribe + send.
# Guarded by window class inside the script (only fires in kitty). See
# dotfiles/hypr/voice-toggle.sh + dotfiles/opencode/tui.json.
bind = , SUPER_L, exec, ~/.config/hypr/voice-toggle.sh
bindr = , SUPER_L, exec, true

# --- Mouse Bindings ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
